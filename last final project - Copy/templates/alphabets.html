<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REAL_TIME SIGN TRANSLATE — Alphabet Detection</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800;900&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <style>
    :root {
      --bg: #080c10;
      --surface: #0e1318;
      --border: #1e2a35;
      --accent: #ffe066;
      --accent2: #ff4f6d;
      --accent3: #00ffe0;
      --text: #e8f0f5;
      --muted: #4a6070;
      --card: #111820
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow-x: hidden
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255, 224, 102, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 224, 102, 0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 48px;
      background: rgba(8, 12, 16, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border)
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none
    }

    .nav-logo-icon {
      width: 34px;
      height: 34px;
      background: var(--accent);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 16px
    }

    .nav-logo h1 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text)
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none
    }

    .nav-links a {
      text-decoration: none;
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.2s
    }

    .nav-links a:hover {
      color: var(--accent)
    }

    .nav-cta {
      padding: 8px 20px;
      background: var(--accent);
      color: var(--bg) !important;
      border-radius: 8px;
      font-weight: 700 !important
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.3
      }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 96px 20px 40px
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
      animation: fadeUp 0.5s ease both
    }

    .breadcrumb {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px
    }

    .breadcrumb a {
      color: var(--accent);
      text-decoration: none
    }

    .page-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -1px
    }

    .page-title span {
      color: var(--accent)
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 6px 14px;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted)
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s
    }

    .status-dot.live {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1.5s infinite
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      animation: fadeUp 0.5s 0.1s ease both
    }

    @media(max-width:900px) {
      .grid {
        grid-template-columns: 1fr
      }

      nav {
        padding: 14px 16px
      }
    }

    .video-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden
    }

    .video-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border)
    }

    .video-header-label {
      font-size: 0.7rem;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase
    }

    .rec-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent2)
    }

    .rec-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent2);
      animation: pulse 1s infinite
    }

    .video-wrapper {
      position: relative;
      aspect-ratio: 4/3;
      background: #000;
      overflow: hidden
    }

    #videoEl {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1)
    }

    #canvas {
      display: none
    }

    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.85rem
    }

    .video-placeholder .icon {
      font-size: 3rem;
      opacity: 0.3
    }

    .video-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, rgba(8, 12, 16, 0.92));
      display: flex;
      align-items: flex-end;
      justify-content: space-between
    }

    .pred-letter {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      color: var(--accent);
      text-shadow: 0 0 40px rgba(255, 224, 102, 0.5);
      letter-spacing: -2px;
      transition: all 0.25s ease;
      font-family: 'Space Mono', monospace
    }

    .pred-letter.idle {
      color: var(--muted);
      font-size: 1.2rem;
      font-weight: 400;
      font-family: 'Syne', sans-serif
    }

    .conf-bar-wrap {
      text-align: right
    }

    .conf-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      margin-bottom: 4px
    }

    .conf-value {
      font-family: 'Space Mono', monospace;
      font-size: 1.4rem;
      color: var(--text)
    }

    .conf-bar {
      width: 100px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden
    }

    .conf-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
      width: 0%
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px
    }

    .card-title {
      font-size: 0.65rem;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px
    }

    .alpha-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px
    }

    .alpha-cell {
      aspect-ratio: 1;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      transition: all 0.2s;
      cursor: default
    }

    .alpha-cell.active {
      background: rgba(255, 224, 102, 0.12);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px rgba(255, 224, 102, 0.2);
      transform: scale(1.08)
    }

    .mode-switch {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      gap: 4px
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 7px;
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: var(--muted)
    }

    .mode-btn.active {
      background: var(--card);
      color: var(--accent);
      border: 1px solid var(--border)
    }

    .btn-row {
      display: flex;
      gap: 10px
    }

    .btn-start,
    .btn-stop {
      flex: 1;
      padding: 12px;
      background: transparent;
      border-radius: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s
    }

    .btn-start {
      border: 1px solid var(--accent3);
      color: var(--accent3)
    }

    .btn-start:hover {
      background: rgba(0, 255, 224, 0.08);
      box-shadow: 0 0 16px rgba(0, 255, 224, 0.15)
    }

    .btn-start:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      background: transparent;
      box-shadow: none
    }

    .btn-stop {
      border: 1px solid var(--accent2);
      color: var(--accent2)
    }

    .btn-stop:hover {
      background: rgba(255, 79, 109, 0.08)
    }

    .btn-stop:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      background: transparent
    }

    .btn-switch {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      cursor: pointer
    }

    .btn-switch:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .btn-switch:disabled {
      opacity: 0.3;
      cursor: not-allowed
    }

    .err-msg {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent2);
      margin-top: 8px;
      display: none
    }
  </style>
</head>

<body>
  <nav>
    <a class="nav-logo" href="/">
      <div class="nav-logo-icon">🔤</div>
      <h1>REAL_TIME SIGN TRANSLATE</h1>
    </a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/types">Sign Types</a></li>
      <li><a href="/detect" class="nav-cta">Words Mode</a></li>
    </ul>
  </nav>

  <div class="wrapper">
    <div class="page-header">
      <div>
        <div class="breadcrumb"><a href="/">Home</a> / <a href="/category">Categories</a> / Alphabets</div>
        <h1 class="page-title">Alphabet <span>Detection</span></h1>
      </div>
      <div class="status-pill">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">OFFLINE</span>
      </div>
    </div>

    <div class="grid">
      <div class="video-panel">
        <div class="video-header">
          <span class="video-header-label">Live Camera Feed · ASL Alphabets</span>
          <div class="rec-badge">
            <div class="rec-dot"></div> REC
          </div>
        </div>
        <div class="video-wrapper">
          <div class="video-placeholder" id="placeholder">
            <div class="icon">🔤</div>
            <span>Press START to begin</span>
          </div>
          <video id="videoEl" autoplay playsinline muted
            style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;"></video>
          <canvas id="canvas" style="display:none"></canvas>
          <img id="annotatedImage"
            style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: none;" />
          <div class="video-overlay">
            <div class="pred-letter idle" id="predLetter">—</div>
            <div class="conf-bar-wrap">
              <div class="conf-label">CONFIDENCE</div>
              <div class="conf-value" id="confValue">—</div>
              <div class="conf-bar">
                <div class="conf-fill" id="confFill"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="side-panel">
        <div class="card">
          <div class="card-title">Detection Mode</div>
          <div class="mode-switch">
            <button class="mode-btn" onclick="switchTo('/detect','words')">Words</button>
            <button class="mode-btn active">Alphabets</button>
          </div>
        </div>
        <div class="card">
          <div class="card-title">A – Z · Live Highlight</div>
          <div class="alpha-grid" id="alphaGrid"></div>
        </div>
        <div class="btn-row">
          <button class="btn-start" id="btnStart" onclick="startCamera()">▶ START</button>
          <button class="btn-stop" id="btnStop" onclick="stopCamera()" disabled>■ STOP</button>
        </div>
        <button class="btn-switch" id="btnSwitch" onclick="switchCamera()" disabled>↻ SWITCH CAMERA</button>
        <div class="err-msg" id="errMsg"></div>
      </div>
    </div>
  </div>

  <script>
    const SESSION_ID = 'sess_' + Math.random().toString(36).slice(2);
    let stream = null, sendLoop = null, prevLetter = null, frameInFlight = false;
    let cameraDeviceId = null;
    const video = document.getElementById('videoEl');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const socket = io({
      transports: ['websocket', 'polling'],
      reconnection: true,
      reconnectionAttempts: Infinity
    });
    const errEl = document.getElementById('errMsg');
    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults((results) => {
      const hand = results.multiHandLandmarks?.[0];
      socket.emit('process_frame_ws', {
        landmarks: hand ? hand.flatMap(point => [point.x, point.y, point.z]) : null,
        session_id: SESSION_ID
      });
    });

    socket.on('connect', () => {
      errEl.style.display = 'none';
      document.getElementById('statusText').textContent = stream ? 'LIVE' : 'READY';
    });
    socket.on('disconnect', () => {
      frameInFlight = false;
      document.getElementById('statusDot').classList.remove('live');
      document.getElementById('statusText').textContent = 'RECONNECTING';
      if (stream) {
        errEl.textContent = 'Connection to the server was lost. Reconnecting...';
        errEl.style.display = 'block';
      }
    });
    socket.on('connect_error', () => {
      frameInFlight = false;
      errEl.textContent = 'Unable to connect to the detection server. Please wait and try again.';
      errEl.style.display = 'block';
    });

    // --- Handle Incoming WebSocket Results ---
    socket.on('frame_result', (data) => {
      document.getElementById('statusDot').classList.toggle('live', data.running);
      document.getElementById('statusText').textContent = data.running ? 'LIVE' : 'STOPPED';

      // Show the image with drawn landmarks when it arrives
      if (data.image) {
        const imgEl = document.getElementById('annotatedImage');
        imgEl.src = data.image;
        imgEl.style.display = 'block';
      }
      frameInFlight = false;
      if (data.error) {
        errEl.textContent = data.error;
        errEl.style.display = 'block';
      }

      const letterEl = document.getElementById('predLetter');
      const word = data.word;

      if (word && word !== '...') {
        const letter = word.toUpperCase();
        letterEl.textContent = letter;
        letterEl.classList.remove('idle');

        if (prevLetter && prevLetter !== letter) {
          document.getElementById('cell-' + prevLetter)?.classList.remove('active');
        }
        document.getElementById('cell-' + letter)?.classList.add('active');
        prevLetter = letter;
      } else {
        letterEl.textContent = '—';
        letterEl.classList.add('idle');
        if (prevLetter) {
          document.getElementById('cell-' + prevLetter)?.classList.remove('active');
          prevLetter = null;
        }
      }

      const conf = data.confidence;
      document.getElementById('confValue').textContent = conf > 0 ? conf + '%' : '—';
      document.getElementById('confFill').style.width = conf > 0 ? conf + '%' : '0%';
    });

    // Build A-Z grid
    const grid = document.getElementById('alphaGrid');
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => {
      const cell = document.createElement('div');
      cell.className = 'alpha-cell'; cell.id = 'cell-' + l; cell.textContent = l;
      grid.appendChild(cell);
    });

    async function switchTo(page, mode) {
      await fetch('/set_mode', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode, session_id: SESSION_ID })
      }).catch(() => { });
      window.location = page;
    }

    async function startCamera() {
      errEl.style.display = 'none';
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        errEl.textContent = 'Camera access requires HTTPS or localhost and a supported browser.';
        errEl.style.display = 'block';
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 360 }, latency: { ideal: 0 } },
          audio: false
        });
      } catch (e) {
        const reason = e.name === 'NotAllowedError' ? 'Allow camera access in your browser settings.'
          : e.name === 'NotFoundError' ? 'No camera was found on this device.'
          : 'The camera could not be started. Check that it is not being used by another app.';
        errEl.textContent = reason;
        errEl.style.display = 'block';
        return;
      }

      video.srcObject = stream;
      cameraDeviceId = stream.getVideoTracks()[0]?.getSettings().deviceId || null;

      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('btnStart').disabled = true;
      document.getElementById('btnStop').disabled = false;
      document.getElementById('btnSwitch').disabled = false;

      const response = await fetch('/start', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'alphabet', session_id: SESSION_ID })
      });
      if (!response.ok) {
        errEl.textContent = 'The server could not start detection. Please try again.';
        errEl.style.display = 'block';
        await stopCamera();
        return;
      }

      // Keep only one request in flight so slow inference cannot build a stale queue.
      frameInFlight = false;
      sendLoop = setInterval(sendFrame, 30);
    }

    async function stopCamera() {
      clearInterval(sendLoop); sendLoop = null;
      frameInFlight = false;
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      video.srcObject = null;
      document.getElementById('annotatedImage').style.display = 'none';
      document.getElementById('annotatedImage').src = '';
      document.getElementById('placeholder').style.display = 'flex';
      document.getElementById('btnStart').disabled = false;
      document.getElementById('btnStop').disabled = true;
      document.getElementById('btnSwitch').disabled = true;
      document.getElementById('statusDot').classList.remove('live');
      document.getElementById('statusText').textContent = 'OFFLINE';

      const letterEl = document.getElementById('predLetter');
      letterEl.textContent = '—'; letterEl.classList.add('idle');
      if (prevLetter) { document.getElementById('cell-' + prevLetter)?.classList.remove('active'); prevLetter = null; }
      document.getElementById('confValue').textContent = '—';
      document.getElementById('confFill').style.width = '0%';

      await fetch('/stop', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: SESSION_ID })
      }).catch(() => { });
    }

    async function switchCamera() {
      if (!stream) return;
      try {
        const devices = (await navigator.mediaDevices.enumerateDevices())
          .filter(device => device.kind === 'videoinput');
        if (devices.length < 2) {
          errEl.textContent = 'Only one camera is available on this device.';
          errEl.style.display = 'block';
          return;
        }
        const currentIndex = Math.max(0, devices.findIndex(device => device.deviceId === cameraDeviceId));
        const nextDevice = devices[(currentIndex + 1) % devices.length];
        stream.getTracks().forEach(track => track.stop());
        stream = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: nextDevice.deviceId }, width: { ideal: 480 }, height: { ideal: 360 } },
          audio: false
        });
        cameraDeviceId = nextDevice.deviceId;
        video.srcObject = stream;
        errEl.style.display = 'none';
      } catch (error) {
        errEl.textContent = 'Unable to switch camera. Check browser camera permissions.';
        errEl.style.display = 'block';
      }
    }

    function sendFrame() {
      if (!stream || video.readyState < 2 || frameInFlight || !socket.connected) return;
      frameInFlight = true;
      canvas.width = 320;
      canvas.height = 240;
      ctx.save(); ctx.scale(-1, 1); ctx.drawImage(video, -canvas.width, 0); ctx.restore();

      // Convert canvas to Base64 (JPEG quality 0.5 for speed)
      const b64 = canvas.toDataURL('image/jpeg', 0.4);

      // Emit over WebSocket instead of HTTP POST
      hands.send({ image: canvas }).catch((error) => {
        frameInFlight = false;
        errEl.textContent = `Browser hand detection failed: ${error.message}`;
        errEl.style.display = 'block';
      });
      window.setTimeout(() => { frameInFlight = false; }, 10000);
    }
  </script>
</body>

</html>
