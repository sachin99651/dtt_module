services:
  - type: web
    name: sign-language-detection
    runtime: python
    plan: free
    buildCommand: pip install -r "last final project - Copy/requirements.txt"
    startCommand: gunicorn --chdir "last final project - Copy" --worker-class gthread --workers 1 --threads 8 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
